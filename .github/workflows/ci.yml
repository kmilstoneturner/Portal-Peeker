name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build the free bundle
        run: npm run build

      # The product's core claim, checked mechanically rather than by review.
      # Fails on any absolute URL to a non-HubSpot host in the built bundle, on
      # any reference to server-client, and on host_permissions widening beyond
      # hubspot.com.
      - name: No network calls in the free build
        run: npm run check:no-network

      # Allowlist check: every large integer in a committed file must be a known
      # synthetic value. A fresh capture dropped in without scrubbing fails here
      # rather than reaching the public repo.
      - name: No real portal data in tracked files
        run: npm run check:no-portal-data

      - run: npm test

<!--
  Hand authored. Never a paste of a real page.

  Two reasons, both already settled in this repo. A real properties table
  carries a portal's custom property labels, which are authored content and are
  never committed. And it carries styled-components class hashes that change on
  every HubSpot build, which would rot this file into asserting on unstable
  strings.

  So: the real nesting, the real data-test-id grammar, and no class attributes
  at all, because nothing in the parser is allowed to select on one.

  Every objectTypeId here is synthetic and deliberately short. Real custom
  object ids carry enough digits to trip tools/check-no-portal-data.mjs, which
  scans .html as well as source.

  See __fixtures__/README.md for what each row is for.
-->

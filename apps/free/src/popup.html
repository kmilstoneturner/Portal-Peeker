<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portal Peeker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>Portal Peeker</h1>
      <span class="kind" id="kind" hidden></span>
    </header>

    <section id="empty" class="empty" hidden>
      <p class="empty-title">Open a HubSpot workflow to capture it.</p>
      <p class="empty-hint" id="empty-hint">
        Already on one? Reload the page. Portal Peeker only sees requests made after it loads.
      </p>
    </section>

    <section id="capture" hidden>
      <dl class="rows">
        <div class="row"><dt>Flow</dt><dd id="f-name">not found</dd></div>
        <div class="row"><dt>Flow ID</dt><dd id="f-flow" class="mono">not found</dd></div>
        <div class="row"><dt>Portal ID</dt><dd id="f-portal" class="mono">not found</dd></div>
        <div class="row"><dt>Version</dt><dd id="f-version" class="mono">not found</dd></div>
        <div class="row"><dt>Captured</dt><dd id="f-when">not found</dd></div>
        <div class="row"><dt>Size</dt><dd id="f-size" class="mono">not found</dd></div>
        <div class="row"><dt>Est. Tokens</dt><dd id="f-tokens" class="mono">not found</dd></div>
      </dl>

      <p class="note" id="degraded" hidden></p>

      <div class="options">
        <label class="check" for="opt-trim">
          <input type="checkbox" id="opt-trim" />
          <span id="opt-trim-label">Trim to workflow logic</span>
        </label>
        <label class="check sub" for="opt-strip">
          <input type="checkbox" id="opt-strip" />
          <span>Strip HTML from email bodies</span>
        </label>
      </div>

      <div class="actions">
        <button id="copy" type="button" class="btn primary">Copy</button>
        <button id="download" type="button" class="btn">Download</button>
        <button id="refresh" type="button" class="btn">Refresh</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
